name: working with env variables
on: 
  push:
    branches:
      - main
jobs:
  test-envars:
    runs-on: ubuntu-latest

    env:
      MY_JOB_LEVEL_VAR: "I AM a job-level env variable"

    steps:
      - name: init
        env:
          STEP_VAR: "I am a step-level env variable"
        run: |
         echo "This is a job-level env variable: $MY_JOB_LEVEL_VAR and this is a step-level env variable: $STEP_VAR"
      - name: context var from  github
        run: | 
          echo "This is a context variable from github: ${{vars.MY_REPOSITORY_VAR}}"
      - name: working with secrets
        run: |
          echo "This is a secret variable: ${{secrets.MY_LANDING_SECRET}}"

      
  