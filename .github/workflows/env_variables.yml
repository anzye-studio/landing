name: working with env variables
on: 
  push:
    branches:
      - main
jobs:
  test-envars:
    runs-on: ubuntu-latest

    env:
      MY_EXAMPLE_VAR: "This is an example env variable"

    steps:
      - name: init
        env:
          STEP_VAR: "This is a step-level env variable"
        run: |
         echo "This is a job-level env variable: $MY_EXAMPLE_VAR and this is a step-level env variable: $STEP_VAR"
  